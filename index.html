<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" href="style.css">
  </head>
  <input id="pattern" type="question">
  <input onClick="run()" type="submit">
  <div id="ex"></div>
  <div id="errorMessage"></div>
  <div id="container"></div>
  <script>
    // define variables
    // whether the pattern is valid or not
    var valid = true;
    // what the pattern is
    var pattern = "test";
    // what type of patter is it options norm = vanilla, sync = syncronous, mult = multiplex, both = syncronous multiplex
    var type = "";
  </script>
  <script src="js/initialize.js" defer></script>
  <script src="js/validNorm.js" defer></script>
  <script>
    document.getElementById("ex").innerHTML = pattern;
    // run after pattern is submitted
    function run() {
      pattern = document.getElementById("pattern").value;
      // check what type of pattern it is
      type(type, pattern, valid);
      // for testing purposes
      type = "norm";
      // check if pattern is valid
      if (type == "norm" && valid == true) {
        validNorm(pattern);
      } else if (type == "sync") {
        validSync(pattern);
      } else if (type == "mult") {
        validMult(pattern);
      } else if (type == "both") {
        validBoth(pattern);
      }

      document.getElementById("ex").innerHTML = valid;

      // if pattern is valid animate it
      if (type == "norm" && valid == true && false) {
        animateNorm(pattern);
      } else if (type == "sync") {
        animateSync(pattern);
      } else if (type == "mult") {
        animateMult(pattern);
      } else if (type == "both") {
        animateBoth(pattern);
      }
    }
  </script>
</html>
