<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" href="style.css">
  </head>
  <input id="pattern" type="question">
  <input onClick="run()" type="submit">
  <div id="ex"></div>
  <div id="errorMessage"></div>
  <div id="container"></div>
  <script>
    // define variables
    // whether the pattern is valid or not
    var valid = true;
    // what the pattern is
    var pattern = "";
    // what type of patter is it options norm = vanilla, sync = syncronous, mult = multiplex, both = syncronous multiplex
    var type = "";
    // dimension of screen
    var screenWidth = 110;
    var screenHeight = 160;
  </script>
  <script src="js/initialize.js" defer></script>
  <script src="js/type.js" defer></script>
  <script src="js/validNorm.js" defer></script>
  <script src="js/animateNorm.js" defer></script>
  <script src="js/validSync.js" defer></script>
  <script src="js/animateSync.js" defer></script>
  <script>
    // run after pattern is submitted
    function run() {
      pattern = document.getElementById("pattern").value;
      // check what type of pattern it is
      type(pattern);
      // check if pattern is valid
      if (valid == true) {
        if (type == "norm") {
          validNorm(pattern);
        } else if (type == "sync") {
          validSync(pattern);
        } else if (type == "mult") {
          validMult(pattern);
        } else if (type == "both") {
          validBoth(pattern);
        }
      }

      if (valid == false) {
        document.getElementById("errorMessage").innerHTML = "Sorry this pattern is not posible.";
      }

      // if pattern is valid animate it
      if (valid == true) {
        if (type == "norm") {
          animateNorm(pattern);
        } else if (type == "sync") {
          animateSync(pattern);
         } else if (type == "mult") {
          animateMult(pattern);
        } else if (type == "both") {
          animateBoth(pattern);
        }
      }
    }
  </script>
</html>
